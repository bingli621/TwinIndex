[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "twinindex"
version = "0.1.0"
description = "Simulation and symbolic calculation of scattering patterns from distorted unit cells and twin domains"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bing Li", email = "bing.li@ess.eu" }]
requires-python = ">=3.12"
# cctbx-base is only distributed through conda-forge, so it is declared in the pixi dependencies below
dependencies = ["numpy>=2", "sympy>=1.14", "mpmath<1.4", "matplotlib>=3.10"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/bingli621/TwinIndex"

[tool.hatch.build.targets.wheel]
packages = ["src/twinindex"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# ---------------------------------- pixi ----------------------------------
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.12"
numpy = ">=2.5.4,<3"
sympy = ">=1.14.0,<2"
# mpmath 1.4 deprecates functions sympy 1.14 still uses; sympy itself requires mpmath<1.4 on PyPI
mpmath = "<1.4"
matplotlib = ">=3.11.2,<4"
cctbx-base = ">=2026.9,<2027"

[tool.pixi.pypi-dependencies]
twinindex = { path = ".", editable = true }

[tool.pixi.feature.test.dependencies]
pytest = "*"

[tool.pixi.feature.test.tasks]
test = "pytest"

[tool.pixi.environments]
default = { features = ["test"], solve-group = "default" }

[tool.pixi.tasks]
cell-definition = "python examples/0_cell_definition.py"
cell-distortion = "python examples/1_cell_distortion.py"
twin-domains = "python examples/2_twin_domains.py"
cafe2as2 = "python examples/3_distortion_and_domains_in_CaFe2As2.py"
